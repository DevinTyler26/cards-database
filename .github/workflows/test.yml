name: Test the Data

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

env:
  CI: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Setup BunJS
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.4

    - name: Install deps
      run: |
        bun install -g @usebruno/cli@4.3.0
        bun install --frozen-lockfile
        cd server
        bun install --frozen-lockfile
        bun run compile

    - name: Validate international/Asian data and the server
      env:
        NODE_OPTIONS: --max-old-space-size=8192
        GOMEMLIMIT: 8GiB
        GOGC: 50
        ASIAN_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      shell: bash
      run: |
        bun run validate
        bun run test:asia-validation
        bun run validate:asia-changes --base "$ASIAN_DIFF_BASE"
        cd server
        bun run --bun validate

    - name: Validate some requests
      shell: bash
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        MAX_WORKERS: 1
      run: |
        set -euo pipefail
        cd server
        # Keep verbose query dumps out of the Actions log transport during timing checks.
        SERVER_LOG="$RUNNER_TEMP/tcgdex-server.log"
        bun src/index.ts > "$SERVER_LOG" 2>&1 &
        SERVER_PID=$!
        cleanup() {
          RESULT=$?
          kill "$SERVER_PID" 2>/dev/null || true
          if [ "$RESULT" -ne 0 ]; then
            tail -n 100 "$SERVER_LOG"
          fi
          exit "$RESULT"
        }
        trap cleanup EXIT
        cd ..

        ATTEMPTS=0
        until curl -sSf http://127.0.0.1:3000/status > /dev/null; do
          ATTEMPTS=$((ATTEMPTS + 1))
          if [ $ATTEMPTS -ge 60 ]; then
            echo "Server did not become ready within 60 seconds" >&2
            kill $SERVER_PID
            exit 1
          fi
          sleep 1
        done

        cd .bruno
        bru run -r --env Developpement

        kill $SERVER_PID
